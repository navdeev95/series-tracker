services:
  # Переопределяем способ запуска для разработки (сборка из исходников)
  series-tracker-app:
    build:
      context: ./series_tracker_app/
    environment:
      SPRING_PROFILES_ACTIVE: dev
    profiles: ["dev"]

  # Prometheus для разработки (targets dev)
  prometheus:
    container_name: prometheus-dev
    volumes:
      - ./prometheus/targets/dev.json:/etc/prometheus/targets/targets.json
    environment:
      PROMETHEUS_ENV: dev
    profiles: ["dev"]