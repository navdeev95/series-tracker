# docker/postgres/pg_hba.conf
# PostgreSQL Client Authentication Configuration File

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# ===============================================================
# Локальные подключения через Unix socket
# ===============================================================
local   all             postgres                                peer map=postgres
local   all             all                                     scram-sha-256

# ===============================================================
# Локальные IPv4 подключения (localhost)
# ===============================================================
host    all             all             127.0.0.1/32           scram-sha-256

# ===============================================================
# IPv6 локальные подключения
# ===============================================================
host    all             all             ::1/128                scram-sha-256

# ===============================================================
# Подключения из Docker сети
# ===============================================================
host    all             all             172.16.0.0/12          scram-sha-256
host    all             all             10.0.0.0/8             scram-sha-256

# ===============================================================
# Подключения извне (для разработки)
# ===============================================================
host    all             all             0.0.0.0/0              scram-sha-256
host    all             all             ::/0                   scram-sha-256

# ===============================================================
# Рекомендуемые настройки для продакшена:
# host    series_tracker   series_tracker_api   app-container-ip   scram-sha-256
# host    series_tracker   series_tracker_dbo   app-container-ip   scram-sha-256
# ===============================================================