name: series-tracker

services:
  #БД для сервиса series-tracker
  series-tracker-db:
    image: postgres:17.5
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    env_file: .env
    environment:
      POSTGRES_DB: series_tracker_dev
      POSTGRES_SCHEMA: series_tracker

      POSTGRES_PASSWORD: ${DB_SU_PWD}

      PG_DBO_USER: series_tracker_dbo
      PG_DBO_PWD: ${DB_DBO_PWD}

      PG_API_USER: series_tracker_api
      PG_API_PWD: ${DB_API_PWD}

      PGDATA: /var/lib/postgresql/data/pgdata
      PGTZ: Asia/Tomsk
      TZ: Asia/Tomsk
    healthcheck: # Проверка готовности PostgreSQL
      test: ["CMD-SHELL", "pg_isready -U $$PG_DBO_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./docker/series_tracker_db/initdb_scripts:/docker-entrypoint-initdb.d
      - ./docker/series_tracker_db/container_data:/var/lib/postgresql/data
      - ./docker/series_tracker_db/container_conf:/etc/postgresql
    ports:
      - 5432:5432

