name: Deploy with Docker to VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5.2.0
        with:
          distribution: 'semeru'
          java-version: '25'
          cache: maven

      - name: Build with Gradle
        run: ./gradlew clean bootJar
        
      - name: Build and Push Docker image
        run: |
           docker build -t navdeev95/series-tracker-app:${{ github.sha }} .
           docker push navdeev95/series-tracker-app:${{ github.sha }}

      - name: ssh-action-deploy
        uses: sebastianjnuwu/ssh-action-deploy@v4
        with:
          IP: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USERNAME }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
          RUN: |
            cd /opt/series-tracker
            git pull origin main
            docker-compose down
            docker-compose up -f docker-compose.base.yml -f docker-compose.prod.yml -d --build
