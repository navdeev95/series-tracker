name: Deploy with Docker to VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Set up JDK
        uses: actions/setup-java@v5.2.0
        with:
          distribution: 'semeru'
          java-version: '21'
          cache: gradle
          
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        
      - name: Build with Gradle
        run: ./gradlew clean bootJar
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/series-tracker-app:latest
          
      - name: ssh-action-deploy
        uses: sebastianjnuwu/ssh-action-deploy@v4
        with:
          IP: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USERNAME }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
          RUN: |
            cd /opt/series-tracker
            git pull origin main
            docker-compose down
            docker-compose up -f docker-compose.base.yml -f docker-compose.prod.yml -d --build
