pluginManagement {
    plugins {
        id 'org.springframework.boot' version "${springVersion}"
        id 'io.spring.dependency-management' version '1.1.7'
    }
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'seriestracker'
include 'common'
include 'tracker'